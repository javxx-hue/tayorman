name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ===============================================================
  # 1. Test, Typecheck & Build
  # ===============================================================
  build-and-test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Mini App
        run: npm run build
        env:
          VITE_TELEGRAM_BOT: sessiyagatayyorlanbot
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 2

  # ===============================================================
  # 2. Automated Production Deployment
  # ===============================================================
  deploy:
    name: Deploy to Production
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST || '54.206.159.221' }} >> ~/.ssh/known_hosts

      - name: Sync Files to Server
        env:
          HOST: ${{ secrets.SERVER_HOST || '54.206.159.221' }}
          USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        run: |
          # Sync production dist
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" dist/ $USER@$HOST:/home/ubuntu/sessiyagatayyorlan/dist/

          # Sync bot and nginx config
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no nginx/spa.conf $USER@$HOST:/home/ubuntu/sessiyagatayyorlan/nginx/spa.conf
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no scripts/bot.mjs $USER@$HOST:/home/ubuntu/sessiyagatayyorlan/bot.mjs

      - name: Restart Services & Reload Caddy
        env:
          HOST: ${{ secrets.SERVER_HOST || '54.206.159.221' }}
          USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $USER@$HOST "
            cd /home/ubuntu/sessiyagatayyorlan && \
            docker compose restart && \
            docker exec mb-caddy caddy reload --config /etc/caddy/Caddyfile
          "

      - name: Verify Production Healthcheck
        run: |
          echo ">>> Verifying https://st.uzbek-talim.uz..."
          sleep 3
          curl -f -I https://st.uzbek-talim.uz || exit 1
          echo ">>> Production is live and healthy!"
