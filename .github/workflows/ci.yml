name: CI

on:
  push:
    branches:
      - main
      - production
      - development
      - 'sanjar/**'
  pull_request:
    branches:
      - main
      - production
      - development

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Mini App
        run: npm run build

      - name: Build Production Admin Web App
        run: npm run build:admin
